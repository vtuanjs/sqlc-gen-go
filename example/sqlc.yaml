version: "2"

plugins:
  - name: golang
    wasm:
      url: file://../bin/sqlc-gen-go.wasm
      sha256: ""

options:
  golang:
    # Override more fields if needed https://github.com/sqlc-dev/sqlc/blob/main/internal/codegen/golang/postgresql_type.go#L12
    overrides:
      - db_type: "pg_catalog.timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true
      - db_type: "pg_catalog.timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: false
      - db_type: "pg_catalog.timestamp"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true
      - db_type: "pg_catalog.timestamp"
        go_type:
          import: "time"
          type: "Time"
          pointer: false
      - db_type: "timestamp"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true
      - db_type: "timestamp"
        go_type:
          import: "time"
          type: "Time"
          pointer: false
      - db_type: "timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true
      - db_type: "timestamptz"
        go_type:
          import: "time"
          type: "Time"
          pointer: false
      - db_type: "jsonb"
        go_type:
          type: "[]byte"
          pointer: false
      - db_type: "jsonb"
        nullable: true
        go_type:
          pointer: true
          type: "[]byte"
      - db_type: "pg_catalog.numeric"
        nullable: true
        go_type:
          import: "github.com/shopspring/decimal"
          package: "decimal"
          type: "Decimal"
          pointer: true
      - db_type: "pg_catalog.numeric"
        go_type:
          import: "github.com/shopspring/decimal"
          package: "decimal"
          type: "Decimal"

sql:
  - schema: postgres/schema.sql
    queries: postgres/queries/
    engine: postgresql
    codegen:
      - out: dbpostgres
        plugin: golang
        options:
          package: dbpostgres
          sql_package: "pgx/v5"
          emit_pointers_for_null_types: true
          emit_empty_slices: false
          emit_interface: true
          emit_result_struct_pointers: true
          emit_enum_valid_method: false
          emit_all_enum_values: true
          omit_unused_structs: true
          emit_methods_with_db_argument: true
          query_parameter_limit: 0
          emit_per_file_queries: true
          emit_err_nil_if_no_rows: true
          emit_tracing:
            import: "example"
            package: "tracing"
            code:
              - "ctx, tracer := tracing.StartTracing(ctx, \"{{.StructName}}.{{.MethodName}}\")"
              - "defer tracer.End()"
          go_generate_mock: "mockgen -source=$GOFILE -destination=mock/$GOFILE -package=mock"
          omit_sqlc_version: true
          emit_dynamic_filter: true
          emit_exported_queries: true
          disable_result_slice_pointers: true

  - schema: sqlite/schema.sql
    queries: sqlite/queries.sql
    engine: sqlite
    codegen:
      - out: dbsqlite
        plugin: golang
        options:
          package: dbsqlite
          sql_package: database/sql
          emit_dynamic_filter: true

  - schema: mysql/schema.sql
    queries: mysql/queries.sql
    engine: mysql
    codegen:
      - out: dbmysql
        plugin: golang
        options:
          package: dbmysql
          sql_package: database/sql
          sql_driver: github.com/go-sql-driver/mysql
          emit_dynamic_filter: true
